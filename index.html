<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>DelíciaBot 🍊🏳️‍🌈 – Suco gostoso</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>DelíciaBot 🍊🏳️‍🌈</h1>
    <p>A revolução começa com um suco ácido e uma resposta debochada</p>
  </header>

  <img class="mascot" src="https://i.imgur.com/tKw2EK4.png" alt="Mascote: suco de laranja com bandeira LGBT">

  <div class="chat-container">
    <div class="inputs">
      <input type="text" id="username" placeholder="Quem é você?" />
      <div style="display: flex; gap: 10px;">
        <input type="text" id="userinput" placeholder="Manda tua ideia, burguês..." style="flex: 1;" />
        <button onclick="sendMessage()">Enviar</button>
      </div>
    </div>

    <div class="messages" id="messages"></div>
  </div>

  <p class="footer-note">DelíciaBot © 2025 – Mais doce que afeto queer, mais ácido que comentário trotskista.</p>

  <script src="script.js"></script>
</body>
</html>
